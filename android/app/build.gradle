plugins {
    id "com.android.application"
}

android {
    namespace "br.social.orbitax"
    compileSdk 34

    defaultConfig {
        applicationId "br.social.orbitax"
        minSdk 21
        targetSdk 34
        // Set by the GitHub build (run number) so every APK installs over the previous one.
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName System.getenv("VERSION_NAME") ?: "1.0.0"
    }

    signingConfigs {
        release {
            // Key fetched from Supabase Vault during the GitHub build (never stored in the repo).
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "keystore-not-provided.jks")
            storeType "pkcs12"
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias "orbitax"
            keyPassword System.getenv("KEYSTORE_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}

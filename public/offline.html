<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#05060f" />
<title>ÓrbitaX — sem conexão</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, #1b1440 0%, #05060f 60%); color: #e5e7f5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 132px; height: auto; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: rgba(229, 231, 245, .65); font-size: 14px; line-height: 1.5; }
  button { border: 0; border-radius: 999px; padding: 12px 28px; font-weight: 600; font-size: 14px; color: #fff; background: linear-gradient(135deg, #2b6cff, #8b5cf6 55%, #ec4899); cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="ÓrbitaX" />
    <h1>Você está sem conexão</h1>
    <p>Assim que a internet voltar, seu universo continua de onde parou.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
